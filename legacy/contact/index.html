<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Contact — Stoneholdt Partners</title>
  <meta name="description" content="Contact Stoneholdt Partners about selling your property."/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

    :root {
      --primary-blue: #1B2A5E;
      --accent-blue: #4A67AD;
      --bg-cream: #EDE8DF;
      --bg-cream-light: #F4F0E6;
    }

    body {
      color: var(--primary-blue);
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      position: relative;
    }

    /* FIXED GRID BACKGROUND — 32px grid lines */
    .bg-grid {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: -1;
      background-color: var(--bg-cream);
      background-image:
        linear-gradient(rgba(27, 42, 94, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(27, 42, 94, 0.06) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* NAV */
    nav {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 24px 60px;
      padding-top: calc(24px + env(safe-area-inset-top, 0px));
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(230, 224, 213, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(27, 42, 94, 0.1);
    }
    nav a.home-link { display: inline-flex; align-items: center; text-decoration: none; }
    nav a.home-link img { height: 32px; width: auto; display: block; }

    /* HEADER */
    .page-header {
      text-align: center;
      padding: 64px 20px 28px;
      max-width: 860px;
      margin: 0 auto;
    }
    .page-header .section-label {
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent-blue);
      font-weight: 500;
      margin-bottom: 16px;
    }
    .page-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 50px;
      font-weight: 500;
      letter-spacing: 0.02em;
      margin-bottom: 14px;
    }
    .page-header .updated {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.55;
    }

    /* DOCUMENT */
    .doc {
      max-width: 760px;
      margin: 0 auto 70px;
      padding: 0 28px;
    }
    .doc h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 27px;
      font-weight: 500;
      letter-spacing: 0.02em;
      margin: 38px 0 12px;
    }
    .doc p, .doc li {
      font-size: 14px;
      line-height: 1.85;
      opacity: 0.85;
    }
    .doc p { margin-bottom: 14px; }
    .doc ul { margin: 0 0 14px 20px; }
    .doc li { margin-bottom: 6px; }
    .doc a { color: var(--accent-blue); text-underline-offset: 3px; }
    .doc .callout {
      border-left: 2px solid var(--accent-blue);
      padding: 4px 0 4px 20px;
      margin: 18px 0;
    }
    .doc .callout p { opacity: 0.95; margin-bottom: 8px; }

    /* CONTACT FORM */
    .form-element { display: flex; flex-direction: column; margin-bottom: 24px; }
    .form-element label {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 8px;
    }
    .form-element input, .form-element textarea {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(27, 42, 94, 0.2);
      padding: 10px 0;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      color: var(--primary-blue);
      outline: none;
      border-radius: 0;
      -webkit-appearance: none;
    }
    .form-element input:focus, .form-element textarea:focus { border-bottom-color: var(--accent-blue); }
    .sms-consent { display: flex; gap: 12px; align-items: flex-start; margin: 30px 0 0; font-size: 12px; line-height: 1.75; }
    .sms-consent input { flex: none; width: 16px; height: 16px; margin-top: 3px; accent-color: var(--accent-blue); }
    .form-actions { text-align: center; margin-top: 35px; }
    .btn {
      display: inline-block;
      padding: 15px 32px;
      border: 1px solid var(--accent-blue);
      color: #EDE8DF;
      background-color: var(--accent-blue);
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .btn:hover { background-color: var(--primary-blue); border-color: var(--primary-blue); }

    footer {
      text-align: center;
      padding: 0 24px calc(40px + env(safe-area-inset-bottom, 0px));
      font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
    }
    footer .legal-links { margin-bottom: 14px; opacity: 0.7; }
    footer .legal-links a { color: var(--primary-blue); text-decoration: none; margin: 0 10px; }
    footer .legal-links a:hover { text-decoration: underline; text-underline-offset: 3px; }
    footer .copy { opacity: 0.35; }

    @media (max-width: 700px) {
      nav { padding: 20px; }
      .page-header { padding: 46px 24px 18px; }
      .page-header h1 { font-size: 38px; }
      .doc { padding: 0 24px; }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <nav>
    <a class="home-link" href="https://www.stoneholdtpartners.com/">
      <img src="/logos/Stoneholdt Partners.png" alt="Stoneholdt Partners" />
    </a>
  </nav>

  <header class="page-header">
    <p class="section-label">Stoneholdt Partners LLC</p>
    <h1>Contact Us</h1>
  </header>

  <main class="doc">
    <p>Thinking about selling a home or lot? Tell us a little about it and we will be in touch.</p>

    <form action="https://formspree.io/f/mrerjjzo" method="POST">
      <input type="hidden" name="_subject" value="New seller inquiry"/>
      <input type="hidden" name="form_type" value="Seller contact form"/>
      <div class="form-element">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name" required/>
      </div>
      <div class="form-element">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required/>
      </div>
      <div class="form-element">
        <label for="phone">Phone (optional)</label>
        <input type="tel" id="phone" name="phone" autocomplete="tel"/>
      </div>
      <div class="form-element">
        <label for="property">Property address (optional)</label>
        <input type="text" id="property" name="property_address" autocomplete="street-address"/>
      </div>
      <div class="form-element">
        <label for="message">Message (optional)</label>
        <textarea id="message" name="message" rows="3"></textarea>
      </div>

      <label class="sms-consent">
        <input type="checkbox" name="sms_consent" value="Yes - checked the SMS consent box"/>
        <span>I agree to receive text messages from Stoneholdt Partners LLC about my property and inquiry at the phone number provided. Message frequency varies. Message and data rates may apply. Reply HELP for help or STOP to opt out. Consent is not a condition of any purchase or sale. <a href="/privacy-policy/">Privacy Policy</a> | <a href="/terms-and-conditions/">Terms &amp; Conditions</a></span>
      </label>

      <div class="form-actions">
        <button type="submit" class="btn">Send</button>
      </div>
    </form>
  </main>

  <footer>
    <div class="legal-links">
      <a href="/privacy-policy/">Privacy Policy</a>
      <a href="/terms-and-conditions/">Terms &amp; Conditions</a>
      <a href="/sms-opt-in/">SMS Opt-In</a>
      <a href="/contact/">Contact</a>
    </div>
    <div class="copy">&copy; 2026 Stoneholdt Partners LLC &mdash; Real Estate Acquisitions</div>
  </footer>
</body>
</html>
